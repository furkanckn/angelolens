name: Hostinger Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hostinger-static-deploy
  # Let the active deployment finish; GitHub will retain the newest pending push.\n  cancel-in-progress: false

jobs:
  # Static site must publish even if Laravel SSH fails —
  # Hostinger Git only updates when the `hostinger` branch moves.
  build-and-publish:
    name: Publish static site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build Hostinger static export
        working-directory: frontend
        env:
          CI: "true"
          NEXT_PUBLIC_SITE_URL: https://angelolens.com
          CMS_URL: https://angelolens.com/panel
          NEXT_PUBLIC_CMS_URL: https://angelolens.com/panel
        run: npm run build:hostinger

      - name: Publish static files to hostinger branch
        working-directory: frontend/public_html
        run: |
          printf '%s\n' \
            '<IfModule mod_rewrite.c>' \
            '    RewriteEngine On' \
            '    RewriteRule ^livewire(?:/.*)?$ panel/index.php [L,QSA]' \
            '</IfModule>' > .htaccess
          ln -sfn ../laravel_app/backend/public panel
          touch .nojekyll
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B hostinger
          git add -A
          git commit -m "Deploy $GITHUB_SHA"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin hostinger

  deploy-panel:
    name: Deploy Laravel panel
    runs-on: ubuntu-latest
    # Do not block the static site if SSH is down
    continue-on-error: true
    steps:
      - name: Configure Hostinger SSH key
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          if [ -z "$HOSTINGER_SSH_KEY" ]; then
            echo "HOSTINGER_SSH_KEY secret is missing"
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$HOSTINGER_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -p 65002 147.79.103.46 >> ~/.ssh/known_hosts

      - name: Deploy Laravel panel
        timeout-minutes: 3
        run: |
          ssh -o ConnectTimeout=15 -o BatchMode=yes -i ~/.ssh/id_ed25519 -p 65002 \
            u833733733@147.79.103.46 \
            '/bin/bash /home/u833733733/domains/angelolens.com/deploy-panel.sh'
