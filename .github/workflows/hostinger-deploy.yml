name: Build static site for Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hostinger-static-deploy
  cancel-in-progress: true

jobs:
  deploy-panel:
    runs-on: ubuntu-latest
    steps:
      - name: Configure Hostinger SSH key
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$HOSTINGER_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 65002 147.79.103.46 >> ~/.ssh/known_hosts

      - name: Deploy Laravel panel
        run: |
          ssh -i ~/.ssh/id_ed25519 -p 65002 \
            u833733733@147.79.103.46 \
            '/bin/bash /home/u833733733/domains/angelolens.com/deploy-panel.sh'

  build-and-publish:
    needs: deploy-panel
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Hostinger static export
        working-directory: frontend
        env:
          CI: "true"
          CMS_URL: "https://angelolens.com/panel"
        run: npm run build:hostinger

      - name: Publish static files to hostinger branch
        working-directory: frontend/public_html
        run: |
          printf '%s\n' \
            '<IfModule mod_rewrite.c>' \
            '    RewriteEngine On' \
            '    RewriteRule ^livewire(?:/.*)?$ panel/index.php [L,QSA]' \
            '</IfModule>' > .htaccess
          ln -s ../laravel_app/backend/public panel
          touch .nojekyll
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B hostinger
          git add -A
          git commit -m "Deploy $GITHUB_SHA"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin hostinger

